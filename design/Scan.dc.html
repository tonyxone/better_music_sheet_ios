<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Work+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Work Sans', system-ui, sans-serif; }
    a { color: #D9A441; } a:hover { color: #E8BC6A; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #16181A; color: #fff; display: flex; flex-direction: column; position: relative; overflow: hidden;">

  <div style="height: 54px; flex: none;"></div>

  <div style="flex: none; display: flex; align-items: center; justify-content: space-between; height: 46px; padding: 0 18px; font-size: 16px;">
    <div style="font-weight: 500; color: #fff;">Cancel</div>
    <div style="font-weight: 600;">Scan pages</div>
    <div style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,0.14); font-size: 13.5px; font-weight: 600;">Auto</div>
  </div>

  <!-- viewfinder -->
  <div style="flex: 1; min-height: 0; position: relative; margin: 10px 14px 0; border-radius: 18px; background: #232629; overflow: hidden;">

    <!-- the page the scanner has locked on -->
    <div style="position: absolute; left: 40px; right: 40px; top: 78px; bottom: 96px; background: #F3EEE4; transform: perspective(700px) rotateX(4deg) rotateZ(-1.2deg); box-shadow: 0 18px 44px rgba(0,0,0,0.5);">
      <svg viewBox="0 0 240 360" width="100%" height="100%">
        <g stroke="#3A3228" stroke-width="1" opacity="0.62">
          <g><line x1="28" y1="56" x2="212" y2="56"></line><line x1="28" y1="63" x2="212" y2="63"></line><line x1="28" y1="70" x2="212" y2="70"></line><line x1="28" y1="77" x2="212" y2="77"></line><line x1="28" y1="84" x2="212" y2="84"></line></g>
          <g><line x1="28" y1="108" x2="212" y2="108"></line><line x1="28" y1="115" x2="212" y2="115"></line><line x1="28" y1="122" x2="212" y2="122"></line><line x1="28" y1="129" x2="212" y2="129"></line><line x1="28" y1="136" x2="212" y2="136"></line></g>
          <g><line x1="28" y1="176" x2="212" y2="176"></line><line x1="28" y1="183" x2="212" y2="183"></line><line x1="28" y1="190" x2="212" y2="190"></line><line x1="28" y1="197" x2="212" y2="197"></line><line x1="28" y1="204" x2="212" y2="204"></line></g>
          <g><line x1="28" y1="228" x2="212" y2="228"></line><line x1="28" y1="235" x2="212" y2="235"></line><line x1="28" y1="242" x2="212" y2="242"></line><line x1="28" y1="249" x2="212" y2="249"></line><line x1="28" y1="256" x2="212" y2="256"></line></g>
          <g><line x1="28" y1="296" x2="212" y2="296"></line><line x1="28" y1="303" x2="212" y2="303"></line><line x1="28" y1="310" x2="212" y2="310"></line><line x1="28" y1="317" x2="212" y2="317"></line><line x1="28" y1="324" x2="212" y2="324"></line></g>
        </g>
        <g fill="#2A231B">
          <ellipse cx="52" cy="70" rx="4" ry="3" transform="rotate(-18 52 70)"></ellipse>
          <ellipse cx="78" cy="63" rx="4" ry="3" transform="rotate(-18 78 63)"></ellipse>
          <ellipse cx="104" cy="77" rx="4" ry="3" transform="rotate(-18 104 77)"></ellipse>
          <ellipse cx="130" cy="56" rx="4" ry="3" transform="rotate(-18 130 56)"></ellipse>
          <ellipse cx="156" cy="70" rx="4" ry="3" transform="rotate(-18 156 70)"></ellipse>
          <ellipse cx="60" cy="190" rx="4" ry="3" transform="rotate(-18 60 190)"></ellipse>
          <ellipse cx="92" cy="183" rx="4" ry="3" transform="rotate(-18 92 183)"></ellipse>
          <ellipse cx="124" cy="197" rx="4" ry="3" transform="rotate(-18 124 197)"></ellipse>
          <ellipse cx="156" cy="176" rx="4" ry="3" transform="rotate(-18 156 176)"></ellipse>
        </g>
      </svg>
    </div>

    <!-- detected quad -->
    <div style="position: absolute; left: 36px; right: 36px; top: 72px; bottom: 90px; border: 2px solid #D9A441; border-radius: 3px; background: rgba(217, 164, 65, 0.10); transform: perspective(700px) rotateX(4deg) rotateZ(-1.2deg);"></div>

    <div style="position: absolute; left: 50%; transform: translateX(-50%); bottom: 26px; display: flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; background: rgba(0,0,0,0.6); font-size: 13px; font-weight: 500; white-space: nowrap;">
      <span style="width: 7px; height: 7px; border-radius: 999px; background: #D9A441;"></span>
      Hold steady — capturing page 4
    </div>
  </div>

  <!-- captured tray + shutter -->
  <div style="flex: none; padding: 16px 18px 34px; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; align-items: center; gap: 9px;">
      <div style="width: 38px; height: 50px; border-radius: 4px; background: #F3EEE4; border: 1px solid rgba(255,255,255,0.18);"></div>
      <div style="width: 38px; height: 50px; border-radius: 4px; background: #F3EEE4; border: 1px solid rgba(255,255,255,0.18);"></div>
      <div style="width: 38px; height: 50px; border-radius: 4px; background: #F3EEE4; border: 1px solid rgba(255,255,255,0.18);"></div>
      <div style="font-size: 13px; color: rgba(255,255,255,0.62); margin-left: 4px;">3 pages</div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="width: 62px; font-size: 15px; color: rgba(255,255,255,0.72);">Retake</div>
      <div style="width: 66px; height: 66px; border-radius: 999px; border: 3px solid rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center;">
        <div style="width: 54px; height: 54px; border-radius: 999px; background: #fff;"></div>
      </div>
      <div style="width: 62px; text-align: right; font-size: 15px; font-weight: 600; color: #D9A441;">Save</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
