<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Work+Sans:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Work Sans', system-ui, sans-serif; }
    a { color: #A83C34; } a:hover { color: #8C4A1F; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #FAF3E6; color: #2E2117; display: flex; flex-direction: column; position: relative; overflow: hidden;">

  <!-- space the real status bar occupies -->
  <div style="height: 54px; flex: none;"></div>

  <div style="flex: none; display: flex; align-items: center; justify-content: flex-end; height: 44px; padding: 0 18px;">
    <div style="width: 44px; height: 44px; border-radius: 999px; background: #FFFDF8; border: 1px solid #F0E4CE; display: flex; align-items: center; justify-content: center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#7A6753" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8.2" r="3.8"></circle>
        <path d="M4.8 20c1.1-3.6 3.9-5.4 7.2-5.4s6.1 1.8 7.2 5.4"></path>
      </svg>
    </div>
  </div>

  <div style="flex: none; padding: 4px 20px 14px;">
    <div style="font-family: 'Spectral', serif; font-size: 34px; font-weight: 600; letter-spacing: -0.01em;">Library</div>
  </div>

  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 11px; padding: 2px 16px 0;">

    <!-- ready -->
    <div style="display: flex; align-items: center; gap: 14px; background: #FFFDF8; border: 1px solid #F0E4CE; border-radius: 16px; padding: 13px 14px;">
      <div style="width: 42px; height: 54px; flex: none; border-radius: 6px; background: #FAF3E6; border: 1px solid #F0E4CE; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="30" viewBox="0 0 22 28" fill="none">
          <g stroke="#7A6753" stroke-width="0.9" opacity="0.5">
            <line x1="2" y1="7" x2="20" y2="7"></line><line x1="2" y1="10.5" x2="20" y2="10.5"></line>
            <line x1="2" y1="14" x2="20" y2="14"></line><line x1="2" y1="17.5" x2="20" y2="17.5"></line>
            <line x1="2" y1="21" x2="20" y2="21"></line>
          </g>
          <ellipse cx="8" cy="17.5" rx="2.6" ry="2" fill="#2E2117" transform="rotate(-18 8 17.5)"></ellipse>
          <line x1="10.4" y1="17" x2="10.4" y2="9" stroke="#2E2117" stroke-width="1.1"></line>
          <ellipse cx="15" cy="14" rx="2.6" ry="2" fill="#2E2117" transform="rotate(-18 15 14)"></ellipse>
          <line x1="17.4" y1="13.5" x2="17.4" y2="5.5" stroke="#2E2117" stroke-width="1.1"></line>
        </svg>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
        <div style="font-family: 'Spectral', serif; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Menuet in G</div>
        <div style="font-size: 12.5px; color: #7A6753;">Yesterday · BWV Anh. 114 · 214 labels</div>
      </div>
      <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#C0B098" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"></path></svg>
    </div>

    <!-- processing -->
    <div style="display: flex; align-items: center; gap: 14px; background: #FFFDF8; border: 1px solid #F0E4CE; border-radius: 16px; padding: 13px 14px;">
      <div style="width: 42px; height: 54px; flex: none; border-radius: 6px; background: #FAF3E6; border: 1px solid #F0E4CE; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A83C34" stroke-width="2.4" stroke-linecap="round">
          <circle cx="12" cy="12" r="9" stroke="#F0E4CE"></circle>
          <path d="M12 3a9 9 0 0 1 8.5 6.1"></path>
        </svg>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
        <div style="font-family: 'Spectral', serif; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Gymnopédie No. 1</div>
        <div style="font-size: 12.5px; color: #7A6753;">Reading sheet music</div>
        <div style="height: 3px; border-radius: 999px; background: #F0E4CE; overflow: hidden;">
          <div style="width: 62%; height: 100%; background: #A83C34; border-radius: 999px;"></div>
        </div>
      </div>
    </div>

    <!-- ready -->
    <div style="display: flex; align-items: center; gap: 14px; background: #FFFDF8; border: 1px solid #F0E4CE; border-radius: 16px; padding: 13px 14px;">
      <div style="width: 42px; height: 54px; flex: none; border-radius: 6px; background: #FAF3E6; border: 1px solid #F0E4CE; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="30" viewBox="0 0 22 28" fill="none">
          <g stroke="#7A6753" stroke-width="0.9" opacity="0.5">
            <line x1="2" y1="7" x2="20" y2="7"></line><line x1="2" y1="10.5" x2="20" y2="10.5"></line>
            <line x1="2" y1="14" x2="20" y2="14"></line><line x1="2" y1="17.5" x2="20" y2="17.5"></line>
            <line x1="2" y1="21" x2="20" y2="21"></line>
          </g>
          <ellipse cx="7" cy="21" rx="2.6" ry="2" fill="#2E2117" transform="rotate(-18 7 21)"></ellipse>
          <line x1="9.4" y1="20.5" x2="9.4" y2="12.5" stroke="#2E2117" stroke-width="1.1"></line>
          <ellipse cx="14" cy="10.5" rx="2.6" ry="2" fill="#2E2117" transform="rotate(-18 14 10.5)"></ellipse>
          <line x1="16.4" y1="10" x2="16.4" y2="3" stroke="#2E2117" stroke-width="1.1"></line>
        </svg>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
        <div style="font-family: 'Spectral', serif; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Prelude in C, BWV 846</div>
        <div style="font-size: 12.5px; color: #7A6753;">3 days ago · 486 labels · 4 pages</div>
      </div>
      <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#C0B098" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"></path></svg>
    </div>

    <!-- failed -->
    <div style="display: flex; align-items: center; gap: 14px; background: #FFFDF8; border: 1px solid #F0E4CE; border-radius: 16px; padding: 13px 14px;">
      <div style="width: 42px; height: 54px; flex: none; border-radius: 6px; background: #F5E3E1; border: 1px solid #EBD2CF; display: flex; align-items: center; justify-content: center;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#A83C34" stroke-width="1.8" stroke-linecap="round"><path d="M12 7.5v6"></path><circle cx="12" cy="16.8" r="0.9" fill="#A83C34" stroke="none"></circle></svg>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
        <div style="font-family: 'Spectral', serif; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Nocturne Op. 9 No. 2</div>
        <div style="font-size: 12.5px; color: #A83C34;">No notes recognized on this scan</div>
      </div>
      <div style="flex: none; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #C0B098; font-size: 13px; font-weight: 600; color: #2E2117; display: flex; align-items: center;">Retry</div>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; background: #FFFDF8; border: 1px solid #F0E4CE; border-radius: 16px; padding: 13px 14px;">
      <div style="width: 42px; height: 54px; flex: none; border-radius: 6px; background: #FAF3E6; border: 1px solid #F0E4CE; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="30" viewBox="0 0 22 28" fill="none">
          <g stroke="#7A6753" stroke-width="0.9" opacity="0.5">
            <line x1="2" y1="7" x2="20" y2="7"></line><line x1="2" y1="10.5" x2="20" y2="10.5"></line>
            <line x1="2" y1="14" x2="20" y2="14"></line><line x1="2" y1="17.5" x2="20" y2="17.5"></line>
            <line x1="2" y1="21" x2="20" y2="21"></line>
          </g>
          <ellipse cx="8" cy="14" rx="2.6" ry="2" fill="#2E2117" transform="rotate(-18 8 14)"></ellipse>
          <line x1="10.4" y1="13.5" x2="10.4" y2="5.5" stroke="#2E2117" stroke-width="1.1"></line>
          <ellipse cx="15" cy="17.5" rx="2.6" ry="2" fill="#2E2117" transform="rotate(-18 15 17.5)"></ellipse>
          <line x1="17.4" y1="17" x2="17.4" y2="9" stroke="#2E2117" stroke-width="1.1"></line>
        </svg>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
        <div style="font-family: 'Spectral', serif; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Gnossienne No. 1</div>
        <div style="font-size: 12.5px; color: #7A6753;">Last week · 268 labels · 3 pages</div>
      </div>
      <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#C0B098" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"></path></svg>
    </div>

  </div>

  <div style="flex: none; display: flex; justify-content: center; padding: 16px 0 34px;">
    <div style="display: flex; align-items: center; gap: 9px; height: 52px; padding: 0 26px; border-radius: 999px; background: #A83C34; color: #fff; font-size: 16px; font-weight: 600; box-shadow: 0 10px 24px rgba(140, 74, 31, 0.32);">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"></path></svg>
      Add sheet
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
