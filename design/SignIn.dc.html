<!doctype html>
<html>

    </div>

          <ellipse cx="42" cy="38" rx="8.5" ry="6.5" transform="rotate(-18 42 38)"></ellipse>
          <ellipse cx="66" cy="32" rx="8.5" ry="6.5" transform="rotate(-18 66 32)"></ellipse>

      <div style="font-family: 'Spectral', serif; font-size: 26px; font-weight: 600; line-height: 1.2;">Play the whole piece</div>
      <div style="font-size: 14px; color: #7A6753; margin-top: 9px; line-height: 1.5; text-wrap: pretty;">

      </div>
    </div>

    <div style="flex: 1;"></div>

    <div style="flex: none; display: flex; flex-direction: column; gap: 12px;">

      <div style="height: 52px; border-radius: 12px; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 16px; font-weight: 500;">
        <span style="width: 19px; height: 19px; border-radius: 4px; border: 1.4px dashed rgba(255,255,255,0.55);"></span>
        Sign in with Apple
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 4px 0;">
        <div style="flex: 1; height: 1px; background: #E4D6B8;"></div>
        <div style="font-size: 12.5px; color: #A2917B;">or</div>
        <div style="flex: 1; height: 1px; background: #E4D6B8;"></div>
      </div>

      <div style="height: 50px; border-radius: 12px; border: 1px solid #E4D6B8; background: #FFFDF8; display: flex; align-items: center; padding: 0 15px; font-size: 15px; color: #A2917B;">Email</div>
      <div style="height: 50px; border-radius: 12px; border: 1px solid #E4D6B8; background: #FFFDF8; display: flex; align-items: center; padding: 0 15px; font-size: 15px; color: #A2917B;">Password</div>

      <div style="height: 52px; border-radius: 12px; background: #A83C34; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; box-shadow: 0 8px 20px rgba(140,74,31,0.26);">Continue</div>

      <div style="display: flex; justify-content: center; gap: 20px; padding-top: 6px; font-size: 13.5px; font-weight: 500;">
        <span style="color: #A83C34;">Create account</span>
        <span style="color: #A83C34;">Forgot password</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
